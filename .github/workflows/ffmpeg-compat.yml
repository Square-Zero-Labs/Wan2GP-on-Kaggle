name: FFmpeg compatibility

on:
  pull_request:
  push:
    branches: [main, fix/ffmpeg-passthrough-compat]

permissions:
  contents: read

jobs:
  decode:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          ffmpeg -version
      - name: Check out the decoder revision used for regression coverage
        uses: actions/checkout@v4
        with:
          repository: deepbeepmeep/Wan2GP
          ref: af2ed29a83dbccc7f1c0571a73005648436b392e
          path: upstream-wan2gp
      - name: Test notebook setup and actual upstream media decoding
        env:
          WAN2GP_SOURCE: ${{ github.workspace }}/upstream-wan2gp
          FFMPEG_TEST_BINARIES: /usr/bin/ffmpeg
        run: python -m unittest discover -s tests -v
